name = "lamsa-studio"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true
keep_vars = true

[assets]
directory = "./public"
run_worker_first = ["/api/*", "/files/*"]

[[d1_databases]]
binding = "DB"
database_name = "lamsa-db"
database_id = "ab019af2-5dbc-494d-9421-3da116f5f6ee"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lamsa-images"

[ai]
binding = "AI"

[vars]
IMAGE_MODEL = "gpt-image-2.5"
IMAGE_API_BASE = "https://codex-everywhere.com/v1"
ADMIN_EMAIL = "samirsaadi610@gmail.com"
FREE_CREDITS = "3"
CHARGILY_API_BASE = "https://pay.chargily.net/api/v2"

# Secret (not stored in this file). Add it in the Cloudflare dashboard or with:
#   npx wrangler secret put IMAGE_API_KEY
# Also add the secret CHARGILY_SECRET_KEY (your Chargily live secret key). Never put it in this file.
